name: Opdater Tilbud (data.js)

on:
  schedule:
    # Kører automatisk hver morgen kl. 05:15 UTC (06:15 / 07:15 dansk tid)
    - cron: '15 5 * * *'
  workflow_dispatch: # Gør det muligt at klikke "Run workflow" manuelt på GitHub
  push:
    paths:
      - '.github/workflows/opdater-tilbud.yml'
      - 'opdater.ps1'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Kør opdater.ps1 og generér data.js
        shell: pwsh
        run: ./opdater.ps1

      - name: Gem opdateret data.js i GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js price_history.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer i data.js"
          else
            git commit -m "Opdater tilbud ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi
